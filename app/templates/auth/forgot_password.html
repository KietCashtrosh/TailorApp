{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:440px;">
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="rounded-circle bg-brand-purple bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
          <i class="bi bi-key text-brand-purple fs-2"></i>
        </div>
        <h4 class="fw-bold mb-1">Forgot Password?</h4>
        <p class="text-muted small">Enter your email and we'll send a reset link.</p>
      </div>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email Address</label>
          <input type="email" name="email" class="form-control rounded-3"
                 placeholder="you@example.com" required autofocus>
        </div>
        <button type="submit" class="btn btn-brand-purple w-100 rounded-pill fw-semibold py-2">
          <i class="bi bi-send me-2"></i>Send Reset Link
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="{{ url_for('auth.login') }}" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
