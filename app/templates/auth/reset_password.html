{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:440px;">
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="rounded-circle bg-brand-purple bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
          <i class="bi bi-shield-lock text-brand-purple fs-2"></i>
        </div>
        <h4 class="fw-bold mb-1">Set New Password</h4>
        <p class="text-muted small">Choose a strong password (min. 6 characters).</p>
      </div>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small">New Password</label>
          <div class="input-group">
            <input type="password" name="password" id="pw1" class="form-control rounded-start-3"
                   placeholder="New password" required minlength="6">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePw('pw1',this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Confirm Password</label>
          <div class="input-group">
            <input type="password" name="confirm_password" id="pw2" class="form-control rounded-start-3"
                   placeholder="Confirm password" required minlength="6">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePw('pw2',this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-brand-purple w-100 rounded-pill fw-semibold py-2">
          <i class="bi bi-check-circle me-2"></i>Reset Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
function togglePw(id, btn) {
  var el = document.getElementById(id);
  var icon = btn.querySelector('i');
  if (el.type === 'password') {
    el.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    el.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
{% endblock %}
