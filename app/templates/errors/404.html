{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width:560px;margin-top:80px;">
  <div style="font-size:6rem;line-height:1;">🧵</div>
  <h1 class="display-4 fw-bold mt-4" style="color:var(--brand);">404</h1>
  <h4 class="fw-semibold mb-2">Page Not Found</h4>
  <p class="text-muted mb-4">Looks like this thread got snipped. The page you're looking for doesn't exist or has been moved.</p>
  <div class="d-flex justify-content-center gap-3">
    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
      <i class="bi bi-arrow-left me-1"></i>Go Back
    </a>
    <a href="{{ url_for('customer.home') }}" class="btn btn-brand px-4">
      <i class="bi bi-house me-1"></i>Home
    </a>
  </div>
</div>
{% endblock %}
