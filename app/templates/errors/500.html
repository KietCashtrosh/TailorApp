{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width:560px;margin-top:80px;">
  <div style="font-size:6rem;line-height:1;">✂️</div>
  <h1 class="display-4 fw-bold mt-4 text-danger">500</h1>
  <h4 class="fw-semibold mb-2">Something Went Wrong</h4>
  <p class="text-muted mb-4">Our stitching machine hit a snag. This is our fault — please try again in a moment. If the problem persists, contact support.</p>
  <div class="d-flex justify-content-center gap-3">
    <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4">
      <i class="bi bi-arrow-clockwise me-1"></i>Try Again
    </a>
    <a href="{{ url_for('customer.home') }}" class="btn btn-brand px-4">
      <i class="bi bi-house me-1"></i>Home
    </a>
  </div>
</div>
{% endblock %}
