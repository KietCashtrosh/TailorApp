{% extends "admin/base.html" %}
{% block title %}Add Delivery Agent{% endblock %}
{% block admin_content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{{ url_for('admin.users', role='delivery') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">Add Delivery Agent</h4>
</div>
<div class="card border-0 shadow-sm" style="max-width:500px;">
  <div class="card-body p-4">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Phone</label>
        <input type="tel" name="phone" class="form-control" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>
      <button type="submit" class="btn btn-brand w-100">Create Delivery Agent</button>
    </form>
  </div>
</div>
{% endblock %}
