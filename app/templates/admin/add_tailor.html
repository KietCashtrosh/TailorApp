{% extends "admin/base.html" %}
{% block title %}Add Tailor{% endblock %}
{% block admin_content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{{ url_for('admin.tailors') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">Add New Tailor</h4>
</div>
<div class="card border-0 shadow-sm" style="max-width:620px;">
  <div class="card-body p-4">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Phone</label>
          <input type="tel" name="phone" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="col-12"><hr class="my-1"><div class="fw-semibold text-muted small">Shop Details</div></div>
        <div class="col-12">
          <label class="form-label fw-semibold">Shop Name</label>
          <input type="text" name="shop_name" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Address</label>
          <input type="text" name="address" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Latitude <span class="text-muted small">(for map)</span></label>
          <input type="number" name="latitude" step="0.0001" class="form-control" placeholder="e.g. 12.9716">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Longitude</label>
          <input type="number" name="longitude" step="0.0001" class="form-control" placeholder="e.g. 77.5946">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Specializations</label>
          <div class="d-flex flex-wrap gap-3">
            {% for d in designs %}
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="specializations" value="{{ d.name }}" id="spec_{{ d.id }}">
              <label class="form-check-label" for="spec_{{ d.id }}">{{ d.name }}</label>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-brand w-100 mt-4">Create Tailor Account</button>
    </form>
  </div>
</div>
{% endblock %}
